# ============================================================
# pantry-db — pull-request verification
#
# Migrations are applied once each, in filename order, and tracked in
# schema_migrations. A migration that fails in the cluster fails inside an
# ArgoCD PreSync hook, which is a bad place to discover a typo. This applies
# the whole chain against a real Postgres on every PR, then applies the
# seed twice to prove it is still idempotent.
# ============================================================

name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pantry
          POSTGRES_PASSWORD: pantry
          POSTGRES_DB: pantry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pantry"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: pantry
      PSQL_ARGS: -h 127.0.0.1 -p 5432 -U pantry -d pantry -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v4

      - name: Apply every migration in order
        run: |
          for f in migrations/*.sql; do
            echo "--- $f"
            psql $PSQL_ARGS -q -f "$f"
          done

      - name: Apply seeds, twice (idempotency)
        run: |
          psql $PSQL_ARGS -q -f seeds/seed.sql
          psql $PSQL_ARGS -q -f seeds/seed.sql

      - name: seed.sql is not stale
        run: |
          python3 scripts/gen-seed-sql.py
          git diff --exit-code -- seeds/seed.sql

      # The steps above apply the files with psql directly; this runs the
      # image's entrypoint itself, twice, on a database of its own. The
      # first run must record the release on every migration it applies,
      # the second must apply nothing.
      - name: The runner, twice (applied_by recorded, then a no-op)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_NAME: runner
          DB_USER: pantry
          DB_PASSWORD: pantry
          PANTRY_DB_VERSION: 9.9.9
          MIGRATIONS_DIR: migrations
          SEED_FILE: seeds/seed.sql
        run: |
          psql $PSQL_ARGS -c "CREATE DATABASE runner"
          sh scripts/run-migrations.sh
          sh scripts/run-migrations.sh > "$RUNNER_TEMP/second.log"
          cat "$RUNNER_TEMP/second.log"
          q() { psql -h 127.0.0.1 -U pantry -d runner -tAc "$1"; }
          files=$(ls migrations/*.sql | wc -l)
          rows=$(q "select count(*) from schema_migrations")
          unrecorded=$(q "select count(*) from schema_migrations where applied_by is distinct from '9.9.9'")
          echo "migrations=$files rows=$rows rows-without-9.9.9=$unrecorded"
          test "$rows" -eq "$files" && test "$unrecorded" -eq 0 \
            || { echo "::error::the runner did not record applied_by on every migration"; exit 1; }
          if grep -q '^apply ' "$RUNNER_TEMP/second.log"; then
            echo "::error::the second run applied a migration again"; exit 1
          fi
